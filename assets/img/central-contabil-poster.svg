<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0F2B48" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#070B14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04060B" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanCenter" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#00A3E0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00A3E0" stop-opacity="0"/>
    </radialGradient>
    <!-- Linear Gradients -->
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="playBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00A3E0" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>
  <rect width="1920" height="1080" fill="url(#gridPattern)"/>
  <circle cx="960" cy="540" r="500" fill="url(#cyanCenter)"/>

  <!-- Code Window Mock Frame in Background -->
  <rect x="360" y="200" width="1200" height="680" rx="24" fill="#0C1322" stroke="url(#cyberBorder)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Window Header -->
  <path d="M 360 224 A 24 24 0 0 1 384 200 L 1536 200 A 24 24 0 0 1 1560 224 L 1560 260 L 360 260 Z" fill="#080D18"/>
  <circle cx="395" cy="230" r="7" fill="#EF4444"/>
  <circle cx="417" cy="230" r="7" fill="#F59E0B"/>
  <circle cx="439" cy="230" r="7" fill="#10B981"/>
  <text x="470" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="1">CENTRAL CONTÁBIL • MAKERPIXEL TECHSYSTEM</text>
  <rect x="1390" y="217" width="145" height="26" rx="6" fill="#00A3E0" fill-opacity="0.15" stroke="#00A3E0" stroke-opacity="0.4"/>
  <text x="1410" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#38BDF8">VISÃO GERAL</text>

  <!-- Big Glowing Play Button Center -->
  <circle cx="960" cy="520" r="64" fill="#00A3E0" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="960" cy="520" r="50" fill="url(#playBtnGrad)"/>
  <polygon points="950,496 982,520 950,544" fill="#FFFFFF"/>

  <!-- Titles and Labels -->
  <text x="960" y="640" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
    Conheça a Central Contábil
  </text>
  <text x="960" y="680" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle">
    Visão geral da plataforma • O vídeo demonstrativo do NotaSync estará disponível em breve
  </text>

  <!-- Bottom Badges Inside Window -->
  <g transform="translate(620, 770)">
    <rect x="0" y="0" width="200" height="38" rx="10" fill="#101A2D" stroke="#1E293B"/>
    <circle cx="22" cy="19" r="4" fill="#10B981"/>
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Automação Contábil</text>

    <rect x="230" y="0" width="220" height="38" rx="10" fill="#101A2D" stroke="#1E293B"/>
    <circle cx="252" cy="19" r="4" fill="#00A3E0"/>
    <text x="266" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Santa Catarina &amp; Brasil</text>

    <rect x="480" y="0" width="200" height="38" rx="10" fill="#101A2D" stroke="#1E293B"/>
    <circle cx="502" cy="19" r="4" fill="#F59E0B"/>
    <text x="516" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Duração: 02:05 min</text>
  </g>
</svg>
